/* Layout: colonna unica centrata, ricerca come elemento dominante, elenco a righe senza bordi; dettaglio in pannello laterale */
:root {

}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }

.pos { color: var(--up); }
.neg { color: var(--down); }
.wrap { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header .wrap { padding-block: 28px 0; }
.logo { font-weight: 600; font-size: 17px; letter-spacing: -.03em; }
.logo i { font-style: normal; color: var(--soft); }

/* Ricerca */
.search { padding-block: 56px 0; }
.q { display: flex; align-items: center; gap: 14px; border-bottom: 1.5px solid var(--fg); }
.q input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: clamp(22px, 4.5vw, 34px); font-weight: 500; letter-spacing: -.035em; padding: 8px 0 12px; }
.q input::placeholder { color: var(--soft); opacity: .6; }

.icon { border: 0; background: none; padding: 6px; cursor: pointer; color: var(--soft); display: grid; place-items: center; border-radius: 8px; position: relative; }
.icon:hover, .icon[aria-expanded="true"] { color: var(--fg); }
.icon .dot { position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--fg); }

.filters { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 18px; }
.filters select { appearance: none; -webkit-appearance: none; border: 0; background: var(--fill); border-radius: 99px; padding: 7px 14px; font-size: 13px; color: var(--soft); cursor: pointer; max-width: 100%; }
.filters select.on { background: var(--fg); color: var(--bg); }
.clear { border: 0; background: none; font-size: 13px; color: var(--soft); cursor: pointer; padding: 7px 6px; }
.clear:hover { color: var(--fg); }

/* Risultati */
.bar { display: flex; justify-content: space-between; align-items: center; padding-block: 40px 8px; font-size: 13px; color: var(--soft); }
.bar select { appearance: none; -webkit-appearance: none; border: 0; background: none; color: var(--soft); font-size: 13px; cursor: pointer; text-align: right; padding: 4px 0; }
.bar select:hover { color: var(--fg); }
.list { padding-bottom: 72px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 64px 76px 96px; gap: 20px; align-items: center; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--hair); background: none; padding: 18px 0; cursor: pointer; }
.row:last-child { border-bottom: 1px solid var(--hair); }
.row:hover .nm { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.main { min-width: 0; display: grid; gap: 3px; }
.nm { font-weight: 500; font-size: 15px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.id { font-size: 12px; color: var(--soft); }
.v { text-align: right; font-size: 14px; }

.spark { display: block; width: 96px; height: 28px; }
.empty { padding: 48px 0; color: var(--soft); text-align: center; border-top: 1px solid var(--hair); }

.foot { font-size: 11px; color: var(--soft); padding-bottom: 32px; }

/* Dettaglio */

dialog::backdrop { background: rgba(0, 0, 0, .28); backdrop-filter: blur(2px); }

.bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }

/* ---------- Utilità ---------- */
const fmt = (v, d = 2) => v.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (v, d = 2) => v == null ? "—" : (v > 0 ? "+" : "") + fmt(v * 100, d) + "%";
const cls = v => v == null ? "" : v >= 0 ? "pos" : "neg";
const aumTxt = m => m >= 1000 ? "€ " + fmt(m / 1000, 1) + " Mld" : "€ " + fmt(m, 0) + " Mln";
const dateTxt = (t, o = { day: "2-digit", month: "short", year: "numeric" }) => new Date(t).toLocaleDateString("it-IT", o);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// NAV simulato: passeggiata log-normale su giorni lavorativi, riallineata al rendimento atteso e all'ultimo NAV.
function buildSeries(e) {
  const r = rng(hash(e.isin));
  const g = () => { let u = 0; while (!u) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); };
  const t = [], x = [];
  const d = new Date(e.inception + "T12:00:00");
  let acc = 0;
  while (d <= TODAY) {
    const wd = d.getDay();
    if (wd > 0 && wd < 6) {
      let z = g(); if (r() < 0.012) z *= 2.6;
      acc += e.sig * Math.sqrt(1 / 252) * z;
      t.push(d.getTime()); x.push(acc);
    }
    d.setDate(d.getDate() + 1);
  }
  const n = x.length - 1, fix = Math.log(1 + e.mu) * (n / 252) - x[n];
  const v = x.map((y, i) => Math.exp(y + fix * i / n));
  const k = e.nav / v[n];
  return { t, v: v.map(y => y * k) };
}

function idxFrom(s, ts) {
  let lo = 0, hi = s.t.length - 1;
  if (ts > s.t[hi]) return hi;
  while (lo < hi) { const m = (lo + hi) >> 1; if (s.t[m] < ts) lo = m + 1; else hi = m; }
  return lo;
}
function back(months, years = 0) { const d = new Date(TODAY); d.setMonth(d.getMonth() - months); d.setFullYear(d.getFullYear() - years); return d.getTime(); }
function retSince(s, ts, annualize) {
  if (ts < s.t[0]) return null;
  const i = idxFrom(s, ts), r = s.v[s.v.length - 1] / s.v[i] - 1;
  if (!annualize) return r;
  return Math.pow(1 + r, 1 / ((s.t[s.t.length - 1] - s.t[i]) / (365.25 * DAY))) - 1;
}

ETFS.forEach(e => {
  e.s = buildSeries(e);
  e.r1 = retSince(e.s, back(12));
  e.r3 = retSince(e.s, back(0, 3), true);
  e.age = (TODAY - new Date(e.inception)) / (365.25 * DAY);
});

/* ---------- Filtri ---------- */
const $ = id => document.getElementById(id);
const SELECTS = { "f-asset": ["asset", "Asset class"], "f-region": ["region", "Area"], "f-focus": ["focus", "Focus"], "f-provider": ["provider", "Emittente"], "f-repl": ["repl", "Replica"], "f-cur": ["cur", "Valuta"], "f-dom": ["dom", "Domicilio"] };
for (const [id, [key, label]] of Object.entries(SELECTS)) {
  const vals = [...new Set(ETFS.map(e => e[key]))].sort((a, b) => a.localeCompare(b, "it"));
  $(id).innerHTML = `<option value="">${label}</option>` + vals.map(v => `<option>${esc(v)}</option>`).join("");
}
const ALL = [...document.querySelectorAll(".filters select")];

function matches(e) {
  const q = $("q").value.trim().toLowerCase();
  if (q) {
    const hay = [e.name, e.ticker, e.isin, e.index, e.provider, e.region, e.asset, e.focus].join(" ").toLowerCase();
    if (!q.split(/\s+/).every(w => hay.includes(w))) return false;
  }
  for (const [id, [key]] of Object.entries(SELECTS)) if ($(id).value && e[key] !== $(id).value) return false;
  if ($("f-dist").value && e.dist !== $("f-dist").value) return false;
  if ($("f-ter").value && e.ter > +$("f-ter").value + 1e-9) return false;
  if ($("f-aum").value && e.aum < +$("f-aum").value) return false;
  if ($("f-age").value && e.age < +$("f-age").value) return false;
  return true;
}

function sparkSvg(e) {
  const s = e.s, i0 = idxFrom(s, back(12)), pts = [];
  const step = Math.max(1, Math.floor((s.v.length - i0) / 60));
  for (let i = i0; i < s.v.length; i += step) pts.push(s.v[i]);
  pts.push(s.v[s.v.length - 1]);
  const mn = Math.min(...pts), mx = Math.max(...pts), W = 96, H = 28;
  const line = pts.map((p, i) => (i ? "L" : "M") + (i / (pts.length - 1) * W).toFixed(1) + " " + (H - 2 - (p - mn) / (mx - mn || 1) * (H - 4)).toFixed(1)).join("");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${line}" fill="none" stroke="${(e.r1 ?? 0) >= 0 ? "var(--up)" : "var(--down)"}" stroke-width="1.4" vector-effect="non-scaling-stroke"/></svg>`;
}

function render() {
  const active = ALL.filter(s => s.value);
  ALL.forEach(s => s.classList.toggle("on", !!s.value));
  $("clear").hidden = !active.length;
  $("fbtn").querySelector(".dot")?.remove();
  if (active.length) $("fbtn").insertAdjacentHTML("beforeend", '<span class="dot"></span>');

  const sort = $("sort").value;
  const res = ETFS.filter(matches).sort((a, b) =>
    sort === "ter" ? a.ter - b.ter :
    sort === "r1" ? (b.r1 ?? -9) - (a.r1 ?? -9) :
    sort === "r3" ? (b.r3 ?? -9) - (a.r3 ?? -9) :
    sort === "name" ? a.name.localeCompare(b.name, "it") : b.aum - a.aum);
  $("count").textContent = res.length + " ETF";
  $("list").innerHTML = res.length ? res.map(e => `
    <button class="row" type="button" data-isin="${e.isin}">
      <span class="main"><span class="nm">${esc(e.name)}</span><span class="id n">${e.ticker} · ${e.isin}</span></span>
      <span class="v n ter">${fmt(e.ter)}%<small>TER</small></span>
      <span class="v n ${cls(e.r1)}">${pct(e.r1, 1)}<small>1A</small></span>
      ${sparkSvg(e)}
    </button>`).join("") : `<div class="empty">Nessun risultato</div>`;
}

/* ---------- Dettaglio ---------- */
const PERIODS = [["1M", () => back(1)], ["6M", () => back(6)], ["YTD", () => new Date(TODAY.getFullYear(), 0, 1).getTime()], ["1A", () => back(12)], ["3A", () => back(0, 3)], ["5A", () => back(0, 5)], ["Max", () => 0]];
let cur = null, curPeriod = "1A";

function openDetail(isin) {
  const e = ETFS.find(x => x.isin === isin); if (!e) return;
  cur = e;
  const s = e.s, last = s.v[s.v.length - 1], chg = last / s.v[s.v.length - 2] - 1;
  const avail = PERIODS.filter(([, f]) => f() === 0 || f() >= s.t[0]);
  if (!avail.some(([p]) => p === curPeriod)) curPeriod = "Max";
  const ytdBase = idxFrom(s, new Date(TODAY.getFullYear(), 0, 1).getTime()) - 1;
  const perf = [
    ["1M", retSince(s, back(1))], ["3M", retSince(s, back(3))], ["YTD", ytdBase >= 0 ? last / s.v[ytdBase] - 1 : null], ["1A", retSince(s, back(12))],
    ["3A ann.", retSince(s, back(0, 3), true)], ["5A ann.", retSince(s, back(0, 5), true)], ["10A ann.", retSince(s, back(0, 10), true)], ["Lancio ann.", retSince(s, 0, true)],
  ];
  const facts = [
    ["Indice", e.index], ["TER", fmt(e.ter) + "%"], ["Patrimonio", aumTxt(e.aum)], ["Dividendi", e.dist],
    ["Replica", e.repl], ["Valuta", e.cur], ["Domicilio", e.dom], ["Lancio", dateTxt(new Date(e.inception + "T12:00:00"))],
    ["Emittente", e.provider], ["Titoli", e.n.toLocaleString("it-IT")],
  ];
  const bars = items => { const mx = Math.max(...items.map(i => i[1])); return `<ul class="bars">${items.map(([n, w]) => `<li><span>${esc(n)}</span><span class="n">${fmt(w, 1)}%</span><i><b style="width:${(w / mx * 100).toFixed(1)}%"></b></i></li>`).join("")}</ul>`; };

  $("d-body").innerHTML = `
    <div class="d-top">
      <div>
        <h2 id="d-name">${esc(e.name)}</h2>
        <div class="id n">${e.ticker} · <button type="button" id="d-isin" title="Copia ISIN">${e.isin}</button></div>
      </div>
      <button class="icon close" type="button" id="d-close" aria-label="Chiudi">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>

    <section>
      <div class="price">
        <div>
          <div class="big">${fmt(last)}<small>${e.cur}</small></div>
          <div class="chg n"><span class="${cls(chg)}">${pct(chg)}</span> <span class="k">${dateTxt(s.t[s.t.length - 1], { day: "numeric", month: "short" })}</span></div>
        </div>
        <div class="periods" role="group" aria-label="Periodo">${avail.map(([p]) => `<button type="button" data-p="${p}" aria-pressed="${p === curPeriod}">${p}</button>`).join("")}</div>
      </div>
      <div class="chart" id="chart"></div>
    </section>

    <div class="stats" id="pstats"></div>

    <section class="sec"><h3>Rendimenti</h3>
      <div class="stats">${perf.map(([k, v]) => `<div><span class="k">${k}</span><span class="n ${cls(v)}">${pct(v, 1)}</span></div>`).join("")}</div>
    </section>

    <section class="sec"><h3>Dati</h3>
      <dl class="facts">${facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
    </section>

    <div class="cols2">
      <section class="sec"><h3>Posizioni</h3>${bars(e.top)}</section>
      <section class="sec"><h3>${esc(e.b1[0])}</h3>${bars(e.b1[1])}</section>
      <section class="sec"><h3>${esc(e.b2[0])}</h3>${bars(e.b2[1])}</section>
    </div>`;

  const dlg = $("detail");
  if (!dlg.open) dlg.showModal();
  dlg.scrollTop = 0;
  $("d-close").onclick = () => dlg.close();
  $("d-isin").onclick = async ev => {
    const b = ev.currentTarget;
    try { await navigator.clipboard.writeText(e.isin); b.textContent = "Copiato"; setTimeout(() => (b.textContent = e.isin), 1200); }
    catch { const r = document.createRange(); r.selectNodeContents(b); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
  };
  document.querySelectorAll(".periods button").forEach(b => b.onclick = () => {
    curPeriod = b.dataset.p;
    document.querySelectorAll(".periods button").forEach(x => x.setAttribute("aria-pressed", x === b));
    drawChart();
  });
  drawChart();
}

function niceTicks(mn, mx, count) {
  const raw = (mx - mn || 1) / count, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
  const out = []; for (let v = Math.ceil(mn / step) * step; v <= mx + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}

function drawChart() {
  const e = cur, s = e.s, box = $("chart"); if (!box) return;
  const from = PERIODS.find(p => p[0] === curPeriod)[1]();
  const i0 = from === 0 ? 0 : idxFrom(s, from), n = s.v.length;
  const step = Math.max(1, Math.floor((n - i0) / 420));
  const T = [], V = [];
  for (let i = i0; i < n; i += step) { T.push(s.t[i]); V.push(s.v[i]); }
  if (T[T.length - 1] !== s.t[n - 1]) { T.push(s.t[n - 1]); V.push(s.v[n - 1]); }

  const W = box.clientWidth, H = box.clientHeight, pl = 0, pr = 48, pt = 8, pb = 24;
  const mn0 = Math.min(...V), mx0 = Math.max(...V), pad = (mx0 - mn0) * 0.08 || mx0 * 0.02;
  const ticks = niceTicks(mn0 - pad, mx0 + pad, 3);
  const lo = Math.min(ticks[0], mn0 - pad), hi = Math.max(ticks[ticks.length - 1], mx0 + pad);
  const X = t => pl + (t - T[0]) / (T[T.length - 1] - T[0]) * (W - pl - pr);
  const Y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  const col = V[V.length - 1] >= V[0] ? "var(--up)" : "var(--down)";
  const line = T.map((t, i) => (i ? "L" : "M") + X(t).toFixed(1) + " " + Y(V[i]).toFixed(1)).join("");
  const dec = hi < 10 ? 2 : hi < 100 ? 1 : 0;
  const spanDays = (T[T.length - 1] - T[0]) / DAY;
  const xo = spanDays > 900 ? { year: "numeric" } : spanDays > 80 ? { month: "short" } : { day: "numeric", month: "short" };
  const nx = W < 420 ? 3 : 4, xt = [];
  for (let k = 0; k < nx; k++) xt.push(T[0] + (T[T.length - 1] - T[0]) * (k + 0.5) / nx);

  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="NAV ${esc(e.ticker)} ${curPeriod}">
    <defs><linearGradient id="gf" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".12"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    ${ticks.filter(v => v >= lo && v <= hi).map(v => `<line class="gl" x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${W}" y="${Y(v) + 4}" text-anchor="end">${fmt(v, dec)}</text>`).join("")}
    ${xt.map(t => `<text class="ax" x="${X(t)}" y="${H - 4}" text-anchor="middle">${dateTxt(t, xo)}</text>`).join("")}
    <path d="${line}L${X(T[T.length - 1])} ${H - pb}L${X(T[0])} ${H - pb}Z" fill="url(#gf)"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round"/>
    <g id="hv" visibility="hidden"><line id="hl" y1="${pt}" y2="${H - pb}" stroke="var(--soft)" stroke-width="1" stroke-dasharray="2 3"/><circle id="hc" r="4" fill="${col}" stroke="var(--bg)" stroke-width="2"/></g>
    <rect x="${pl}" y="0" width="${W - pl - pr}" height="${H}" fill="transparent" id="hit"/>
  </svg><div class="tip" id="tip" hidden></div>`;

  const hit = box.querySelector("#hit"), g = box.querySelector("#hv"), tip = box.querySelector("#tip"), hl = box.querySelector("#hl"), hc = box.querySelector("#hc");
  const move = ev => {
    const x = ev.clientX - box.getBoundingClientRect().left;
    const tt = T[0] + (x - pl) / (W - pl - pr) * (T[T.length - 1] - T[0]);
    let j = 0, best = Infinity; for (let k = 0; k < T.length; k++) { const d = Math.abs(T[k] - tt); if (d < best) { best = d; j = k; } }
    const cx = X(T[j]), cy = Y(V[j]);
    g.setAttribute("visibility", "visible");
    hl.setAttribute("x1", cx); hl.setAttribute("x2", cx); hc.setAttribute("cx", cx); hc.setAttribute("cy", cy);
    tip.hidden = false;
    tip.innerHTML = `<b>${fmt(V[j])}</b>${dateTxt(T[j])}`;
    const tw = tip.offsetWidth; tip.style.left = Math.min(Math.max(cx, tw / 2), W - tw / 2) + "px";
    tip.style.top = (cy > 56 ? cy - 46 : cy + 12) + "px";
  };
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", () => { g.setAttribute("visibility", "hidden"); tip.hidden = true; });

  const lr = []; for (let i = Math.max(i0, 1); i < n; i++) lr.push(Math.log(s.v[i] / s.v[i - 1]));
  const mean = lr.reduce((a, b) => a + b, 0) / lr.length;
  const vol = Math.sqrt(lr.reduce((a, b) => a + (b - mean) ** 2, 0) / (lr.length - 1)) * Math.sqrt(252);
  let peak = s.v[i0], mdd = 0; for (let i = i0; i < n; i++) { peak = Math.max(peak, s.v[i]); mdd = Math.min(mdd, s.v[i] / peak - 1); }
  const r = s.v[n - 1] / s.v[i0] - 1;
  $("pstats").innerHTML = [
    ["Rendimento", `<span class="${cls(r)}">${pct(r)}</span>`],
    ["Volatilità", fmt(vol * 100) + "%"],
    ["Max drawdown", pct(mdd)],
    ["Min – Max", `${fmt(Math.min(...V))} – ${fmt(Math.max(...V))}`],
  ].map(([k, v]) => `<div><span class="k">${k}</span><span class="n">${v}</span></div>`).join("");
}

/* ---------- Eventi ---------- */
$("list").addEventListener("click", ev => { const b = ev.target.closest(".row"); if (b) openDetail(b.dataset.isin); });
$("detail").addEventListener("click", ev => { if (ev.target === $("detail")) $("detail").close(); });
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => $("detail").open && drawChart(), 120); });
$("q").addEventListener("input", render);
ALL.concat($("sort")).forEach(el => el.addEventListener("input", render));
$("clear").addEventListener("click", () => { ALL.forEach(s => (s.value = "")); render(); });
$("fbtn").addEventListener("click", ev => {
  const b = ev.currentTarget, open = b.getAttribute("aria-expanded") !== "true";
  b.setAttribute("aria-expanded", open); $("filters").hidden = !open;
});
document.addEventListener("keydown", ev => { if (ev.key === "/" && !/INPUT|SELECT/.test(document.activeElement.tagName)) { ev.preventDefault(); $("q").focus(); } });

render();
</script>
