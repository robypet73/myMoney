const fmt = (v, d = 2) => v.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (v, d = 2) => { if (v == null) return "—"; const r = +(v * 100).toFixed(d) || 0; return (r > 0 ? "+" : "") + fmt(r, d) + "%"; };
const cls = v => v == null ? "" : v >= 0 ? "pos" : "neg";
const aumTxt = m => m >= 1000 ? "€ " + fmt(m / 1000, 1) + " Mld" : "€ " + fmt(m, 0) + " Mln";
const dateTxt = (t, o = { day: "2-digit", month: "short", year: "numeric" }) => new Date(t).toLocaleDateString("it-IT", o);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// NAV simulato: passeggiata log-normale su giorni lavorativi, riallineata al rendimento atteso e all'ultimo NAV.
// Fattore di mercato comune: azioni correlate tra loro, obbligazioni e oro quasi indipendenti.
const BETA = { Azionario: 0.85, Immobiliare: 0.8, Obbligazionario: 0.05, "Materie prime": 0.1 };
const MK = new Map();
function mkt(k) {
  if (!MK.has(k)) { const r = rng(hash("m" + k)); let u = 0; while (!u) u = r(); MK.set(k, Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r())); }
  return MK.get(k);
}
function buildSeries(e) {
  const r = rng(hash(e.isin));
  const g = () => { let u = 0; while (!u) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); };
  const t = [], x = [];
  const d = new Date(e.inception + "T12:00:00");
  let acc = 0;
  while (d <= TODAY) {
    const wd = d.getDay();
    if (wd > 0 && wd < 6) {
      let z = g(); if (r() < 0.012) z *= 2.6;
      const b = BETA[e.asset] ?? 0.3; z = b * mkt(Math.floor(d.getTime() / DAY)) + Math.sqrt(1 - b * b) * z;
      acc += e.sig * Math.sqrt(1 / 252) * z;
      t.push(d.getTime()); x.push(acc);
    }
    d.setDate(d.getDate() + 1);
  }
  const n = x.length - 1, fix = Math.log(1 + e.mu) * (n / 252) - x[n];
  const v = x.map((y, i) => Math.exp(y + fix * i / n));
  const k = e.nav / v[n];
  return { t, v: v.map(y => y * k) };
}

function idxFrom(s, ts) {
  let lo = 0, hi = s.t.length - 1;
  if (ts > s.t[hi]) return hi;
  while (lo < hi) { const m = (lo + hi) >> 1; if (s.t[m] < ts) lo = m + 1; else hi = m; }
  return lo;
}
function back(months, years = 0) { const d = new Date(TODAY); d.setMonth(d.getMonth() - months); d.setFullYear(d.getFullYear() - years); return d.getTime(); }
function retSince(s, ts, annualize) {
  if (ts !== 0 && ts < s.t[0]) return null;
  const i = idxFrom(s, ts), r = s.v[s.v.length - 1] / s.v[i] - 1;
  if (!annualize) return r;
  return Math.pow(1 + r, 1 / ((s.t[s.t.length - 1] - s.t[i]) / (365.25 * DAY))) - 1;
}

ETFS.forEach(e => {
  e.s = buildSeries(e);
  e.r1 = retSince(e.s, back(12));
  e.r3 = retSince(e.s, back(0, 3), true);

const LIQ = { SWDA: [150, .03], VWCE: [60, .06], CSPX: [200, .02], XMME: [5, .15], EIMI: [40, .08], IMAE: [8, .07], FMI: [1.5, .12], XMJP: [2, .12], RBOT: [4, .12], IWDP: [2, .15], IEGA: [20, .05], IBTM: [15, .04], AGGH: [25, .05], SGLD: [60, .05] };

function calcStats(e) { // volatilità, massimo calo e Sharpe a 12 mesi
  const s = e.s, i0 = idxFrom(s, back(12)), r = [];
  for (let i = i0 + 1; i < s.v.length; i++) r.push(Math.log(s.v[i] / s.v[i - 1]));
  const m = r.reduce((a, b) => a + b, 0) / (r.length || 1), sd = Math.sqrt(r.reduce((a, b) => a + (b - m) ** 2, 0) / Math.max(r.length - 1, 1));
  e.vol1 = sd * Math.sqrt(252); let pk = s.v[i0], dd = 0;
  for (let i = i0; i < s.v.length; i++) { pk = Math.max(pk, s.v[i]); dd = Math.min(dd, s.v[i] / pk - 1); }
  e.dd1 = dd; e.sh1 = e.vol1 ? (e.r1 ?? 0) / e.vol1 : null;
}

  const T = pts.map((_, i) => i), X = i => i / n * W, Y = v => H - 2 - (v - mn) / (mx - mn || 1) * (H - 4);
  const art = splitArt(T, pts, pts.map(() => pts[0]), X, Y, "sp" + e.isin);

function drawChart() {
  const e = cur, s = e.s, box = $("chart"); if (!box) return;
  const from = PERIODS.find(p => p[0] === curPeriod)[1]();
  const i0 = from === 0 ? 0 : idxFrom(s, from), n = s.v.length;
  const step = Math.max(1, Math.floor((n - i0) / 420));
  const T = [], V = [];
  for (let i = i0; i < n; i += step) { T.push(s.t[i]); V.push(s.v[i]); }
  if (T[T.length - 1] !== s.t[n - 1]) { T.push(s.t[n - 1]); V.push(s.v[n - 1]); }

  const W = box.clientWidth, H = box.clientHeight, pl = 0, pr = 48, pt = 8, pb = 24;
  const mn0 = Math.min(...V), mx0 = Math.max(...V), pad = (mx0 - mn0) * 0.08 || mx0 * 0.02;
  const ticks = niceTicks(mn0 - pad, mx0 + pad, 3);
  const lo = Math.min(ticks[0], mn0 - pad), hi = Math.max(ticks[ticks.length - 1], mx0 + pad);
  const X = t => pl + (t - T[0]) / (T[T.length - 1] - T[0]) * (W - pl - pr);
  const Y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  const col = V[V.length - 1] >= V[0] ? "var(--up)" : "var(--down)";
  const line = T.map((t, i) => (i ? "L" : "M") + X(t).toFixed(1) + " " + Y(V[i]).toFixed(1)).join("");
  const dec = hi < 10 ? 2 : hi < 100 ? 1 : 0;
  const spanDays = (T[T.length - 1] - T[0]) / DAY;
  const xo = spanDays > 900 ? { year: "numeric" } : spanDays > 80 ? { month: "short" } : { day: "numeric", month: "short" };
  const nx = W < 420 ? 3 : 4, xt = [];
  for (let k = 0; k < nx; k++) xt.push(T[0] + (T[T.length - 1] - T[0]) * (k + 0.5) / nx);

  const art = splitArt(T, V, V.map(() => V[0]), X, Y, "gf");
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="NAV ${esc(e.ticker)} ${curPeriod}">
    <defs>${art.defs}</defs>
    ${ticks.filter(v => v >= lo && v <= hi).map(v => `<line class="gl" x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${W}" y="${Y(v) + 4}" text-anchor="end">${fmt(v, dec)}</text>`).join("")}
    ${xt.map(t => `<text class="ax" x="${X(t)}" y="${H - 4}" text-anchor="middle">${dateTxt(t, xo)}</text>`).join("")}
    ${art.fills}
    <line x1="${pl}" x2="${W - pr}" y1="${Y(V[0])}" y2="${Y(V[0])}" stroke="var(--soft)" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="${line}" fill="none" stroke="${art.stroke}" stroke-width="1.7" stroke-linejoin="round"/>
    <g id="hv" visibility="hidden"><line id="hl" y1="${pt}" y2="${H - pb}" stroke="var(--soft)" stroke-width="1" stroke-dasharray="2 3"/><circle id="hc" r="4" fill="${col}" stroke="var(--bg)" stroke-width="2"/></g>
    <rect x="${pl}" y="0" width="${W - pl - pr}" height="${H}" fill="transparent" id="hit"/>
  </svg><div class="tip" id="tip" hidden></div>`;

  const hit = box.querySelector("#hit"), g = box.querySelector("#hv"), tip = box.querySelector("#tip"), hl = box.querySelector("#hl"), hc = box.querySelector("#hc");
  const move = ev => {
    const x = ev.clientX - box.getBoundingClientRect().left;
    const tt = T[0] + (x - pl) / (W - pl - pr) * (T[T.length - 1] - T[0]);
    let j = 0, best = Infinity; for (let k = 0; k < T.length; k++) { const d = Math.abs(T[k] - tt); if (d < best) { best = d; j = k; } }
    const cx = X(T[j]), cy = Y(V[j]);
    g.setAttribute("visibility", "visible");
    hl.setAttribute("x1", cx); hl.setAttribute("x2", cx); hc.setAttribute("cx", cx); hc.setAttribute("cy", cy);
    tip.hidden = false;
    tip.innerHTML = `<b>${fmt(V[j])}</b>${dateTxt(T[j])}`;
    const tw = tip.offsetWidth; tip.style.left = Math.min(Math.max(cx, tw / 2), W - tw / 2) + "px";
    tip.style.top = (cy > 56 ? cy - 46 : cy + 12) + "px";
  };
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", () => { g.setAttribute("visibility", "hidden"); tip.hidden = true; });

  const lr = []; for (let i = Math.max(i0, 1); i < n; i++) lr.push(Math.log(s.v[i] / s.v[i - 1]));
  const mean = lr.reduce((a, b) => a + b, 0) / lr.length;
  const vol = Math.sqrt(lr.reduce((a, b) => a + (b - mean) ** 2, 0) / (lr.length - 1)) * Math.sqrt(252);
  let peak = s.v[i0], mdd = 0; for (let i = i0; i < n; i++) { peak = Math.max(peak, s.v[i]); mdd = Math.min(mdd, s.v[i] / peak - 1); }
  const r = s.v[n - 1] / s.v[i0] - 1;
  $("pstats").innerHTML = [
    ["Rendimento", `<span class="${cls(r)}">${pct(r)}</span>`],
    ["Volatilità", fmt(vol * 100) + "%"],
    ["Max drawdown", pct(mdd)],
    ["Min – Max", `${fmt(Math.min(...V))} – ${fmt(Math.max(...V))}`],
  ].map(([k, v]) => `<div><span class="k">${k}</span><span class="n">${v}</span></div>`).join("");
}

// Valida un portafoglio importato: restituisce { pf, err }.
function cleanPf(p) {
  const err = [];
  if (!p || typeof p !== "object") return { err: ["portafoglio non valido"] };
  const name = String(p.name || "").trim() || "Senza nome";
  const id = String(p.id || "").trim() || name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "pf-" + Date.now();
  if (p.kind === "draft") {
    const items = [], amount = +p.amount, start = String(p.start || "");
    (Array.isArray(p.items) ? p.items : []).forEach((it, k) => {
      const isin = String((it && it.isin) || "").trim().toUpperCase(), w = +(it && it.weight);
      if (!byIsin(isin)) return err.push(`ETF ${k + 1}: ISIN ${isin || "mancante"} non disponibile`);
      if (!(w >= 0)) return err.push(`ETF ${k + 1}: peso non valido`);
      if (items.some(x => x.isin === isin)) return err.push(`ETF ${k + 1}: ${isin} duplicato`);
      items.push({ isin, weight: w });
    });
    if (!(amount > 0)) err.push("importo non valido");
    if (!/^\d{4}-\d{2}-\d{2}$/.test(start) || isNaN(dateMs(start)) || dateMs(start) > Date.now() + DAY) err.push("data di simulazione non valida (AAAA-MM-GG)");
    return { pf: { id, name, currency: String(p.currency || "EUR"), kind: "draft", amount, start, items }, err };
  }
  const lots = [];
  (Array.isArray(p.lots) ? p.lots : []).forEach((l, i) => {
    const n = i + 1, isin = String((l && l.isin) || "").trim().toUpperCase(), qty = +(l && l.qty), price = +(l && l.price);
    if (!byIsin(isin)) return err.push(`acquisto ${n}: ISIN ${isin || "mancante"} non disponibile`);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(l.date || "") || isNaN(dateMs(l.date))) return err.push(`acquisto ${n}: data non valida (AAAA-MM-GG)`);
    if (dateMs(l.date) > Date.now() + DAY) return err.push(`acquisto ${n}: data nel futuro`);
    if (!isFinite(qty) || qty === 0 || !(price > 0)) return err.push(`acquisto ${n}: quantità (negativa = vendita) o prezzo non validi`);
    lots.push({ isin, date: l.date, qty, price });
  });
  lots.sort(byDate); if (!err.length) { const se = sellErr(lots); if (se) err.push(se); }
  return { pf: { id, name, currency: String(p.currency || "EUR"), kind: "owned", lots }, err };
}

// Serie allineate su una griglia di date comune (ultimo prezzo noto).
function alignPx(es, start) {
  let base = [];
  es.forEach(e => { const a = e.s.t.filter(t => t >= start); if (a.length > base.length) base = a; });
  const px = es.map(e => { const s = e.s; let j = 0; return base.map(t => { while (j + 1 < s.t.length && s.t[j + 1] <= t) j++; return s.v[j]; }); });
  return { t: base, px };
}
function pfBuild(pf) {
  const lots = [...pfLots(pf)].sort(byDate);
  const isins = [...new Set(lots.map(l => l.isin))], es = isins.map(byIsin);
  const lastT = Math.max(...es.map(e => e.s.t[e.s.t.length - 1])); // un acquisto di oggi può cadere dopo l'ultimo dato
  const { t, px } = alignPx(es, Math.min(dateMs(lots[0].date), lastT)), n = t.length;
  const units = es.map(() => new Float64Array(n)), flow = new Float64Array(n), cost = new Float64Array(n);
  const qty = es.map(() => 0), costH = es.map(() => 0);
  lots.forEach(l => {
    const i = isins.indexOf(l.isin), k = idxOf(t, dateMs(l.date));
    for (let m = k; m < n; m++) units[i][m] += l.qty;
    flow[k] += l.qty * px[i][k]; cost[k] += l.qty * l.price;
    if (l.qty > 0) { qty[i] += l.qty; costH[i] += l.qty * l.price; } else { costH[i] += l.qty * (qty[i] ? costH[i] / qty[i] : 0); qty[i] += l.qty; }
  });
  const V = new Float64Array(n), idx = new Float64Array(n);
  for (let m = 0; m < n; m++) { let s = 0; for (let i = 0; i < es.length; i++) s += units[i][m] * px[i][m]; V[m] = s; if (m) cost[m] += cost[m - 1]; }
  idx[0] = 100;
  for (let m = 1; m < n; m++) idx[m] = idx[m - 1] * (V[m - 1] > 0 ? (V[m] - flow[m]) / V[m - 1] : 1);
  const last = n - 1, vh = es.map((_, i) => units[i][last] * px[i][last]);
  return { pf, es, isins, t, V, cost, idx, qty, costH, vh, flow, cw: vh.map(v => v / V[last]), last, lastPx: px.map(p => p[last]), act: es.map((_, i) => i).filter(i => qty[i] > 1e-9) };
}
function pfStats(P) {
  const r = []; for (let m = 1; m <= P.last; m++) r.push(P.idx[m] / P.idx[m - 1] - 1);
  if (r.length < 2) return { tot: P.idx[P.last] / 100 - 1, ann: null, vol: 0, dd: 0, sh: null, yrs: 0 };
  const mean = r.reduce((a, b) => a + b, 0) / r.length, sd = Math.sqrt(r.reduce((a, b) => a + (b - mean) ** 2, 0) / (r.length - 1));
  const yrs = (P.t[P.last] - P.t[0]) / (365.25 * DAY), tot = P.idx[P.last] / 100 - 1;
  let pk = 100, dd = 0; for (let m = 0; m <= P.last; m++) { pk = Math.max(pk, P.idx[m]); dd = Math.min(dd, P.idx[m] / pk - 1); }
  const ann = yrs >= 0.5 ? Math.pow(1 + tot, 1 / yrs) - 1 : null, vol = sd * Math.sqrt(252);
  return { tot, ann, vol, dd, sh: ann == null ? null : ann / vol, yrs };

// Frontiera efficiente long-only da portafogli casuali, rendimenti e covarianze storici (rf = 0).
function frontierOld(P) {
  const start = Math.max(back(0, 5), ...P.es.map(e => e.s.t[0]));
  const { t, px } = alignPx(P.es, start), k = px.length;
  if (k < 2 || t.length < 60) return null;
  const R = px.map(p => p.slice(1).map((x, j) => x / p[j] - 1)), nn = R[0].length;
  const mu = R.map(r => r.reduce((a, b) => a + b, 0) / nn);

// Frontiera efficiente long-only sugli ETF ancora in portafoglio, con tetto opzionale al peso; rendimenti e covarianze storici, rf = 0.

  const { t, px } = alignPx(es, start);
  if (t.length < 60) return null;
  const R = px.map(p => p.slice(1).map((x, j) => x / p[j] - 1)), nn = R[0].length;
  const mu = R.map(r => r.reduce((a, b) => a + b, 0) / nn);
  const C = R.map((a, i) => R.map((b, j) => { let s = 0; for (let m = 0; m < nn; m++) s += (a[m] - mu[i]) * (b[m] - mu[j]); return s / (nn - 1) * 252; }));
  const M = mu.map(x => x * 252);
  const ev = w => { let r = 0, v = 0; for (let i = 0; i < k; i++) { r += w[i] * M[i]; for (let j = 0; j < k; j++) v += w[i] * w[j] * C[i][j]; } return { r, v: Math.sqrt(Math.max(v, 0)), w }; };
  const tot = act.reduce((a, i) => a + P.vh[i], 0), cw = act.map(i => P.vh[i] / tot);
  const ok = w => w.every(x => x <= cap + 1e-9);
  const rnd = rng(12345), pts = [];
  if (cap >= 1) for (let i = 0; i < k; i++) pts.push(ev(Array.from({ length: k }, (_, j) => +(i === j))));
  for (let n = 0, got = 0; n < 150000 && got < 40000; n++) {
    const p = [1, 1.5, 3][n % 3], w = Array.from({ length: k }, () => Math.pow(-Math.log(rnd() || 1e-9), p)), s = w.reduce((a, b) => a + b, 0), x = w.map(v => v / s);
    if (ok(x)) { pts.push(ev(x)); got++; }

  const refine = (best, score) => {
    let b = best, sb = score(b); const rr = rng(99);
    for (let it = 0; it < 6000; it++) {
      const step = it < 3000 ? 0.08 : 0.02, w = b.w.map(x => Math.max(0, x + (rr() - 0.5) * step)), s = w.reduce((a, c) => a + c, 0); if (!s) continue;
      const x = w.map(v => v / s); if (!ok(x)) continue;

    }

  };

  const minV = refine(best(sMin), sMin), maxS = refine(best(sSh), sSh), vol = refine(best(sVol), sVol), ret = refine(best(sRet), sRet);
  pts.push(minV, maxS, vol, ret);
  const srt = pts.slice().sort((a, b) => a.v - b.v), line = [minV]; let top = minV.r;
  for (const p of srt) if (p.v > minV.v && p.r > top) { top = p.r; line.push(p); }
  return { pts, bg: pts.filter((_, i) => i % 60 === 0), line, minV, maxS, vol, ret, cur, act, ev, cap, yrs: (t[t.length - 1] - t[0]) / (365.25 * DAY) };
}

    fills: runs.map((r, k) => `<path d="${pth(r)}" fill="url(#${gid}f${k})"/>`).join(""),

}

function livePerf(P) {

  const flows = b => { let s = 0; for (let m = b + 1; m <= n; m++) s += P.flow[m]; return s; };
  const since = start => { const b = Math.max(lastBefore(P.t, start), 0); return { r: li / P.idx[b] - 1, e: Vl - P.V[b] - flows(b) }; };
  const d = new Date(P.t[n]), y = d.getFullYear(), at = (yy, mm, dd) => new Date(yy, mm, dd).getTime();

  const bE = lastBefore(P.t, at(y, 0, 1)), bS = Math.max(lastBefore(P.t, at(y - 1, 0, 1)), 0);
  const prev = bE > bS ? { r: P.idx[bE] / P.idx[bS] - 1, e: P.V[bE] - P.V[bS] - (flows(bS) - flows(bE)) } : null;

$("lot-etf").addEventListener("change", suggestPrice); $("lot-date").addEventListener("change", suggestPrice);
$("lot-price").addEventListener("input", () => ($("lot-price").dataset.touched = "1"));
function commit(id) { saveUser(); allPf(); pfCur = PFLIST.find(p => p.id === id) || PFLIST[0]; fillSel(); renderPf(); }
function ownPf(src = pfCur) { // un portafoglio di prova si modifica su una copia personale
  if (!src.sample) return src;
  let id = src.id + "-mio", n = 2; while (USER.some(u => u.id === id)) id = src.id + "-mio" + n++;
  const c = { id, name: src.name.replace("Prova · ", "") + " (mio)", currency: src.currency, kind: src.kind || "owned" };
  if (isDraft(src)) { c.amount = src.amount; c.start = src.start; c.items = src.items.map(x => ({ ...x })); } else c.lots = src.lots.map(l => ({ ...l }));
  USER.unshift(c); return c;
}
let editIdx = null;
function resetForm() { editIdx = null; $("lot-submit").textContent = "Aggiungi"; $("lot-cancel").hidden = true; $("lot-qty").value = ""; $("lot-op").value = "1"; delete $("lot-price").dataset.touched; suggestPrice(); }
$("lot-cancel").addEventListener("click", () => { resetForm(); $("lot-msg").textContent = ""; });
$("lot-form").addEventListener("submit", ev => {
  ev.preventDefault();
  const e = byIsin($("lot-etf").value), date = $("lot-date").value, sgn = +$("lot-op").value, qty = +$("lot-qty").value, price = +$("lot-price").value, m = $("lot-msg");
  const bad = t => { m.textContent = t; m.className = "fc-note err"; };
  if (!date || isNaN(dateMs(date))) return bad("Data non valida");
  if (dateMs(date) > Date.now() + DAY) return bad("La data è nel futuro");
  if (date < e.inception) return bad(`${e.ticker} è stato lanciato il ${dateTxt(dateMs(e.inception))}`);
  if (!(qty > 0) || !(price > 0)) return bad("Quantità e prezzo devono essere maggiori di zero");
  const lots = pfCur.lots.map(l => ({ ...l })), lot = { isin: e.isin, date, qty: sgn * qty, price };
  if (editIdx != null) lots[editIdx] = lot; else lots.push(lot);
  lots.sort(byDate); const se = sellErr(lots); if (se) return bad(se.charAt(0).toUpperCase() + se.slice(1));
  const wasEdit = editIdx != null, pf = ownPf(); pf.lots = lots; commit(pf.id); resetForm();
  m.textContent = wasEdit ? "Operazione modificata" : sgn > 0 ? "Acquisto aggiunto" : "Vendita aggiunta"; m.className = "fc-note";
});
$("pf-lots").addEventListener("click", ev => {
  const ed = ev.target.closest(".ed"), d = ev.target.closest(".del:not(.ed)"), m = $("lot-msg");
  if (ed) {
    const l = pfCur.lots[+ed.dataset.i]; if (!l) return;
    $("lot-etf").value = l.isin; $("lot-date").value = l.date; $("lot-op").value = l.qty < 0 ? "-1" : "1"; $("lot-qty").value = Math.abs(l.qty); $("lot-price").value = l.price; $("lot-price").dataset.touched = "1";
    editIdx = +ed.dataset.i; $("lot-submit").textContent = "Salva"; $("lot-cancel").hidden = false; m.textContent = ""; $("lot-form").scrollIntoView({ block: "center", behavior: "smooth" });
  } else if (d) {
    const lots = pfCur.lots.filter((_, i) => i !== +d.dataset.i), se = sellErr(lots);
    if (se) { m.textContent = "Non puoi eliminarlo: " + se; m.className = "fc-note err"; return; }
    const pf = ownPf(); pf.lots = lots; commit(pf.id); resetForm(); m.textContent = "Operazione eliminata"; m.className = "fc-note";
  }
});
$("ef-cap").addEventListener("change", () => PF && renderPf());
$("rb-goal").addEventListener("change", () => PF && renderRb());
$("rb-apply").addEventListener("click", () => {
  if (!RB || !RB.length) return;
  if (isDraft(pfCur)) { const pf = ownPf(); RB.forEach(r => { const it = pf.items.find(x => x.isin === r.isin); if (it) it.weight = r.w; }); commit(pf.id); $("lot-msg").textContent = "Pesi del draft aggiornati"; return; }
  const today = new Date().toISOString().slice(0, 10), lots = pfCur.lots.map(l => ({ ...l })).concat(RB.map(r => ({ isin: r.isin, date: today, qty: r.dq, price: +r.pr.toFixed(2) }))).sort(byDate), se = sellErr(lots);
  if (se) { $("rb-note").textContent = se; return; }
  const n = RB.length, pf = ownPf(); pf.lots = lots; commit(pf.id); $("lot-msg").textContent = `Ribilanciamento applicato: ${n} operazioni`; $("lot-msg").className = "fc-note";
});
$("pf-def").addEventListener("click", () => { try { localStorage.setItem(DEF_KEY, pfCur.id); } catch {} updDef(); });
$("pf-name").addEventListener("change", ev => { const v = ev.target.value.trim(); if (!v || pfCur.sample) return; pfCur.name = v; commit(pfCur.id); });
$("pf-new").addEventListener("click", () => {
  const pf = { id: "pf-" + Date.now().toString(36), name: `Portafoglio ${USER.length + 1}`, currency: "EUR", lots: [] };
  USER.unshift(pf); commit(pf.id); $("lot-msg").textContent = ""; $("pf-name").focus(); $("pf-name").select();
});
$("list").addEventListener("change", ev => { const c = ev.target.closest(".chk input"); if (!c) return; if (c.checked) SEL.add(c.dataset.isin); else SEL.delete(c.dataset.isin); updSel(); });
$("sel-clear").addEventListener("click", () => { SEL.clear(); render(); updSel(); });
$("sel-add").addEventListener("click", () => openAddTo([...SEL]));
$("dr-tbl").addEventListener("change", ev => { const inp = ev.target.closest(".wi"); if (inp) editDraft(pf => { pf.items[+inp.dataset.i].weight = Math.max(0, +inp.value || 0); }); });
$("dr-tbl").addEventListener("click", ev => { const b = ev.target.closest(".del"); if (b) editDraft(pf => { pf.items.splice(+b.dataset.i, 1); }); });
$("dr-amt").addEventListener("change", ev => { const v = +ev.target.value; if (v > 0) editDraft(pf => { pf.amount = v; }); else renderPf(); });
$("dr-start").addEventListener("change", ev => { const v = ev.target.value; if (v && dateMs(v) <= Date.now() + DAY) editDraft(pf => { pf.start = v; }); else renderPf(); });
$("dr-add-btn").addEventListener("click", () => { const isin = $("dr-add").value; if (isin) editDraft(pf => addItems(pf, [isin])); });
$("dr-norm").addEventListener("click", () => editDraft(pf => { const t = pf.items.reduce((a, i) => a + i.weight, 0); if (t > 0) pf.items.forEach(i => (i.weight = +(i.weight / t * 100).toFixed(1))); }));
$("dr-own").addEventListener("click", () => {
  if (!DRSIZE.length) return;
  const pf = ownPf(), today = ymd(Date.now());
  pf.lots = DRSIZE.map(r => ({ isin: r.isin, date: today, qty: r.qty, price: +r.price.toFixed(2) })).sort(byDate); pf.kind = "owned"; delete pf.items; delete pf.amount; delete pf.start;
  commit(pf.id); $("lot-msg").textContent = "Convertito in acquistato: acquisti registrati a oggi ai prezzi correnti"; $("lot-msg").className = "fc-note";
});
$("to-draft").addEventListener("click", () => {
  if (!PF) return; const P = PF, items = P.act.map(i => ({ isin: P.es[i].isin, weight: +(P.cw[i] * 100).toFixed(1) }));
  const amount = Math.max(100, Math.round(P.act.reduce((a, i) => a + P.qty[i] * P.es[i].live, 0) / 100) * 100);
  const pf = { id: "pf-" + Date.now().toString(36), name: pfCur.name.replace("Prova · ", "") + " (draft)", currency: "EUR", kind: "draft", amount, start: defStart(items.map(i => i.isin)), items };
  USER.unshift(pf); commit(pf.id);
});
$("pf-newd").addEventListener("click", () => {
  const pf = { id: "pf-" + Date.now().toString(36), name: `Draft ${USER.filter(isDraft).length + 1}`, currency: "EUR", kind: "draft", amount: 10000, start: ymd(back(0, 3)), items: [] };
  USER.unshift(pf); commit(pf.id); $("pf-name").focus(); $("pf-name").select();
});
let rt2; window.addEventListener("resize", () => { clearTimeout(rt2); rt2 = setTimeout(() => { if (!$("v-port").hidden) { drawPfNav(); drawEF(); } }, 120); });

render(); renderPf();
showView(location.hash === "#cerca" ? "search" : "port");
