<style>
/* Layout: colonna unica centrata, ricerca come elemento dominante, elenco a righe senza bordi; dettaglio in pannello laterale */
:root {
  --bg: #FAFAF9;
  --raised: #FFFFFF;
  --fg: #111312;
  --soft: #8A8F8C;
  --hair: #ECEDEC;
  --fill: #F1F2F1;
  --up: #12865F;
  --down: #D2462F;
  --f: "Geist", "Helvetica Neue", Arial, system-ui, sans-serif;
  --m: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0C0D0C; --raised: #141615; --fg: #EDEEED; --soft: #7D837F; --hair: #1F2321; --fill: #191C1A; --up: #4FD09A; --down: #FF7A62; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0C0D0C; --raised: #141615; --fg: #EDEEED; --soft: #7D837F; --hair: #1F2321; --fill: #191C1A; --up: #4FD09A; --down: #FF7A62; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 1.5px solid var(--fg); outline-offset: 2px; }
.n { font-family: var(--m); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.pos { color: var(--up); }
.neg { color: var(--down); }
.wrap { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header .wrap { padding-block: 28px 0; }
.logo { font-weight: 600; font-size: 17px; letter-spacing: -.03em; }
.logo i { font-style: normal; color: var(--soft); }

/* Ricerca */
.search { padding-block: 56px 0; }
.q { display: flex; align-items: center; gap: 14px; border-bottom: 1.5px solid var(--fg); }
.q input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: clamp(22px, 4.5vw, 34px); font-weight: 500; letter-spacing: -.035em; padding: 8px 0 12px; }
.q input::placeholder { color: var(--soft); opacity: .6; }
.q input::-webkit-search-cancel-button { display: none; }
.icon { border: 0; background: none; padding: 6px; cursor: pointer; color: var(--soft); display: grid; place-items: center; border-radius: 8px; position: relative; }
.icon:hover, .icon[aria-expanded="true"] { color: var(--fg); }
.icon .dot { position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--fg); }

.filters { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 18px; }
.filters select { appearance: none; -webkit-appearance: none; border: 0; background: var(--fill); border-radius: 99px; padding: 7px 14px; font-size: 13px; color: var(--soft); cursor: pointer; max-width: 100%; }
.filters select.on { background: var(--fg); color: var(--bg); }
.clear { border: 0; background: none; font-size: 13px; color: var(--soft); cursor: pointer; padding: 7px 6px; }
.clear:hover { color: var(--fg); }

/* Risultati */
.bar { display: flex; justify-content: space-between; align-items: center; padding-block: 40px 8px; font-size: 13px; color: var(--soft); }
.bar select { appearance: none; -webkit-appearance: none; border: 0; background: none; color: var(--soft); font-size: 13px; cursor: pointer; text-align: right; padding: 4px 0; }
.bar select:hover { color: var(--fg); }
.list { padding-bottom: 72px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 64px 76px 96px; gap: 20px; align-items: center; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--hair); background: none; padding: 18px 0; cursor: pointer; }
.row:last-child { border-bottom: 1px solid var(--hair); }
.row:hover .nm { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.main { min-width: 0; display: grid; gap: 3px; }
.nm { font-weight: 500; font-size: 15px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.id { font-size: 12px; color: var(--soft); }
.v { text-align: right; font-size: 14px; }
.v small { display: block; font-family: var(--f); font-size: 11px; color: var(--soft); letter-spacing: 0; }
.spark { display: block; width: 96px; height: 28px; }
.empty { padding: 48px 0; color: var(--soft); text-align: center; border-top: 1px solid var(--hair); }
@media (max-width: 560px) {
  .row { grid-template-columns: minmax(0, 1fr) auto 72px; gap: 14px; }
  .row .ter { display: none; }
  .spark { width: 72px; }
}
.foot { font-size: 11px; color: var(--soft); padding-bottom: 32px; }

/* Dettaglio */
dialog { padding: 0; border: 0; margin: 0 0 0 auto; height: 100%; max-height: 100%; width: min(760px, 100%); max-width: 100%; background: var(--bg); color: var(--fg); }
dialog::backdrop { background: rgba(0, 0, 0, .28); backdrop-filter: blur(2px); }
dialog[open] { animation: in .25s cubic-bezier(.2, .8, .2, 1); }
@keyframes in { from { transform: translateX(24px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { dialog[open] { animation: none; } }
.d { padding-block: calc(24px + env(safe-area-inset-top, 0px)) calc(48px + env(safe-area-inset-bottom, 0px)); padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: grid; gap: 40px; }
.d-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.d-top h2 { font-size: clamp(20px, 3vw, 24px); font-weight: 500; letter-spacing: -.03em; line-height: 1.2; margin: 0 0 6px; text-wrap: balance; }
.d-top .id button { border: 0; background: none; padding: 0; color: inherit; cursor: copy; font: inherit; }
.d-top .id button:hover { color: var(--fg); }
.close { flex: none; margin: -6px -6px 0 0; }

.price { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; }
.big { font-family: var(--m); font-size: clamp(34px, 6vw, 44px); font-weight: 400; letter-spacing: -.05em; line-height: 1; }
.big small { font-size: 14px; color: var(--soft); letter-spacing: 0; margin-left: 6px; }
.chg { font-size: 13px; margin-top: 8px; }
.periods { display: flex; gap: 2px; }
.periods button { border: 0; background: none; border-radius: 99px; padding: 5px 10px; font-size: 12.5px; color: var(--soft); cursor: pointer; font-family: var(--m); }
.periods button:hover { color: var(--fg); }
.periods button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.chart { position: relative; height: 260px; margin-top: 20px; touch-action: pan-y; }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chart .ax { fill: var(--soft); font-family: var(--m); font-size: 10.5px; }
.chart .gl { stroke: var(--hair); }
.tip { position: absolute; top: 0; pointer-events: none; font-size: 11.5px; color: var(--soft); white-space: nowrap; transform: translateX(-50%); text-align: center; }
.tip b { display: block; font-family: var(--m); font-weight: 500; font-size: 13px; color: var(--fg); }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px 16px; }
.stats div { display: grid; gap: 4px; min-width: 0; }
.k { font-size: 11.5px; color: var(--soft); }
.stats .n { font-size: 15px; }
.sec h3 { font-size: 11.5px; font-weight: 500; color: var(--soft); margin: 0 0 14px; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 32px; margin: 0; }
.facts div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--hair); font-size: 13.5px; min-width: 0; }
.facts dt { color: var(--soft); flex: none; }
.facts dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px 32px; }
.bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.bars li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; font-size: 13px; }
.bars span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bars .n { color: var(--soft); font-size: 12px; }
.bars i { grid-column: 1 / -1; height: 2px; background: var(--hair); display: block; }
.bars i b { display: block; height: 100%; background: var(--fg); }
[hidden] { display: none !important; }
:root { --c1: #0E7C66; --c2: #2F5FD0; --c3: #D08A12; --c4: #8A4FD6; --c5: #C8412F; --c6: #8A8F8C; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --c1: #3FC6A5; --c2: #6C93F2; --c3: #E8AD3F; --c4: #B58AF0; --c5: #F07C69; --c6: #8F9692; } }
:root[data-theme="dark"] { --c1: #3FC6A5; --c2: #6C93F2; --c3: #E8AD3F; --c4: #B58AF0; --c5: #F07C69; --c6: #8F9692; }

.bar2 { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.tabs { display: flex; gap: 2px; }
.tabs button { border: 0; background: none; border-radius: 99px; padding: 6px 14px; font-size: 13.5px; color: var(--soft); cursor: pointer; }
.tabs button:hover { color: var(--fg); }
.tabs button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

.pf-sel { padding-block: 48px 0; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; }
.selwrap { position: relative; max-width: 100%; }
.selwrap::after { content: ""; position: absolute; right: 4px; bottom: 18px; width: 8px; height: 8px; border-right: 1.5px solid var(--soft); border-bottom: 1.5px solid var(--soft); transform: rotate(45deg); pointer-events: none; }
.pf-sel select { appearance: none; -webkit-appearance: none; border: 0; border-bottom: 1.5px solid var(--fg); border-radius: 0; background: transparent; font-size: clamp(22px, 4.5vw, 34px); font-weight: 500; letter-spacing: -.035em; padding: 4px 36px 8px 0; cursor: pointer; max-width: 100%; }
.badge { font-size: 12px; color: var(--soft); padding-bottom: 12px; }
.badge a { color: inherit; }
.badge i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--soft); margin-right: 7px; vertical-align: 1px; }
.badge.real i { background: var(--up); }

.kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 20px 16px; padding-top: 36px; }
.kpi div { display: grid; gap: 4px; min-width: 0; }
.kpi .n { font-size: 17px; }
.pf-sec { padding-top: 56px; }
.pf-sec .price { margin-bottom: 0; }
.scroll { overflow-x: auto; }
.chart.tall { height: 320px; }

.hrow { display: grid; grid-template-columns: minmax(0, 1fr) 64px 104px 72px; gap: 20px; align-items: center; padding: 14px 0; border-top: 1px solid var(--hair); }
.hrow:last-child { border-bottom: 1px solid var(--hair); }
.hrow .main { display: grid; gap: 3px; min-width: 0; }
.nm-btn { border: 0; background: none; padding: 0; text-align: left; font-weight: 500; font-size: 15px; letter-spacing: -.01em; cursor: pointer; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nm-btn:hover { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.id a { color: inherit; }
.id a:hover { color: var(--fg); }

.donuts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px 32px; }
.dn { display: flex; gap: 20px; align-items: center; min-width: 0; }
.dn h3 { margin: 0 0 12px; }
.donut { width: 120px; height: 120px; flex: none; }
.leg { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; min-width: 0; flex: 1; }
.leg li { display: flex; align-items: center; gap: 8px; min-width: 0; }
.leg .lt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sw { width: 8px; height: 8px; border-radius: 50%; flex: none; }

.eft { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 18px; min-width: 420px; }
.eft th, .eft td { padding: 9px 0 9px 12px; border-bottom: 1px solid var(--hair); text-align: right; vertical-align: top; white-space: nowrap; }
.eft th { font-size: 11.5px; font-weight: 500; color: var(--soft); }
.eft th:first-child, .eft td:first-child { text-align: left; padding-left: 0; white-space: normal; }
.eft .wl { display: block; font-size: 12px; color: var(--soft); margin-top: 2px; }
.dotm { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }

.fb { padding: 16px 0 6px; border-top: 1px solid var(--hair); }
.fb h4 { margin: 0 0 4px; font-size: 14px; font-weight: 500; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.fb h4 em { font-style: normal; color: var(--soft); font-weight: 400; margin-left: 6px; }
#json-box { display: block; width: 100%; min-height: 200px; font-family: var(--m); font-size: 12px; line-height: 1.55; border: 1px solid var(--hair); background: var(--fill); color: var(--fg); border-radius: 10px; padding: 12px; resize: vertical; }
.io { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.io button, .io .btn { border: 1px solid var(--hair); background: none; border-radius: 99px; padding: 6px 14px; font-size: 13px; cursor: pointer; color: var(--fg); }
.io button:hover, .io .btn:hover { border-color: var(--fg); }
#io-msg { font-size: 12.5px; color: var(--soft); }

.fb-sum { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 14px 0; border-top: 1.5px solid var(--fg); font-size: 14px; font-weight: 500; }
.srcs { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 13px; color: var(--soft); }
.srcs a { color: var(--fg); text-underline-offset: 3px; }
@media (max-width: 600px) {
  .hrow { grid-template-columns: minmax(0, 1fr) 52px 92px; gap: 12px; }
  .hrow .y1 { display: none; }
  .donuts { grid-template-columns: minmax(0, 1fr); }

}

.src { color: var(--soft); text-decoration: none; }
.src:hover { color: var(--fg); }
.fc { list-style: none; margin: 0; padding: 0; }

</style>

/* ---------- Utilità ---------- */
const fmt = (v, d = 2) => v.toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (v, d = 2) => v == null ? "—" : (v > 0 ? "+" : "") + fmt(v * 100, d) + "%";
const cls = v => v == null ? "" : v >= 0 ? "pos" : "neg";
const aumTxt = m => m >= 1000 ? "€ " + fmt(m / 1000, 1) + " Mld" : "€ " + fmt(m, 0) + " Mln";
const dateTxt = (t, o = { day: "2-digit", month: "short", year: "numeric" }) => new Date(t).toLocaleDateString("it-IT", o);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// NAV simulato: passeggiata log-normale su giorni lavorativi, riallineata al rendimento atteso e all'ultimo NAV.
// Fattore di mercato comune: azioni correlate tra loro, obbligazioni e oro quasi indipendenti.
const BETA = { Azionario: 0.85, Immobiliare: 0.8, Obbligazionario: 0.05, "Materie prime": 0.1 };
const MK = new Map();
function mkt(k) {
  if (!MK.has(k)) { const r = rng(hash("m" + k)); let u = 0; while (!u) u = r(); MK.set(k, Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r())); }
  return MK.get(k);
}
function buildSeries(e) {
  const r = rng(hash(e.isin));
  const g = () => { let u = 0; while (!u) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); };
  const t = [], x = [];
  const d = new Date(e.inception + "T12:00:00");
  let acc = 0;
  while (d <= TODAY) {
    const wd = d.getDay();
    if (wd > 0 && wd < 6) {
      let z = g(); if (r() < 0.012) z *= 2.6;
      const b = BETA[e.asset] ?? 0.3; z = b * mkt(Math.floor(d.getTime() / DAY)) + Math.sqrt(1 - b * b) * z;
      acc += e.sig * Math.sqrt(1 / 252) * z;
      t.push(d.getTime()); x.push(acc);
    }
    d.setDate(d.getDate() + 1);
  }
  const n = x.length - 1, fix = Math.log(1 + e.mu) * (n / 252) - x[n];
  const v = x.map((y, i) => Math.exp(y + fix * i / n));
  const k = e.nav / v[n];
  return { t, v: v.map(y => y * k) };
}

function idxFrom(s, ts) {
  let lo = 0, hi = s.t.length - 1;
  if (ts > s.t[hi]) return hi;
  while (lo < hi) { const m = (lo + hi) >> 1; if (s.t[m] < ts) lo = m + 1; else hi = m; }
  return lo;
}
function back(months, years = 0) { const d = new Date(TODAY); d.setMonth(d.getMonth() - months); d.setFullYear(d.getFullYear() - years); return d.getTime(); }
function retSince(s, ts, annualize) {
  if (ts !== 0 && ts < s.t[0]) return null;
  const i = idxFrom(s, ts), r = s.v[s.v.length - 1] / s.v[i] - 1;
  if (!annualize) return r;
  return Math.pow(1 + r, 1 / ((s.t[s.t.length - 1] - s.t[i]) / (365.25 * DAY))) - 1;
}

ETFS.forEach(e => {
  e.s = buildSeries(e);
  e.r1 = retSince(e.s, back(12));
  e.r3 = retSince(e.s, back(0, 3), true);
  e.age = (TODAY - new Date(e.inception)) / (365.25 * DAY);
});

/* ---------- Filtri ---------- */
const $ = id => document.getElementById(id);
const SELECTS = { "f-asset": ["asset", "Asset class"], "f-region": ["region", "Area"], "f-focus": ["focus", "Focus"], "f-provider": ["provider", "Emittente"], "f-repl": ["repl", "Replica"], "f-cur": ["cur", "Valuta"], "f-dom": ["dom", "Domicilio"] };
for (const [id, [key, label]] of Object.entries(SELECTS)) {
  const vals = [...new Set(ETFS.map(e => e[key]))].sort((a, b) => a.localeCompare(b, "it"));
  $(id).innerHTML = `<option value="">${label}</option>` + vals.map(v => `<option>${esc(v)}</option>`).join("");
}
const ALL = [...document.querySelectorAll(".filters select")];

function matches(e) {
  const q = $("q").value.trim().toLowerCase();
  if (q) {
    const hay = [e.name, e.ticker, e.isin, e.index, e.provider, e.region, e.asset, e.focus].join(" ").toLowerCase();
    if (!q.split(/\s+/).every(w => hay.includes(w))) return false;
  }
  for (const [id, [key]] of Object.entries(SELECTS)) if ($(id).value && e[key] !== $(id).value) return false;
  if ($("f-dist").value && e.dist !== $("f-dist").value) return false;
  if ($("f-ter").value && e.ter > +$("f-ter").value + 1e-9) return false;
  if ($("f-aum").value && e.aum < +$("f-aum").value) return false;
  if ($("f-age").value && e.age < +$("f-age").value) return false;
  return true;
}

function sparkSvg(e) {
  const s = e.s, i0 = idxFrom(s, back(12)), pts = [];
  const step = Math.max(1, Math.floor((s.v.length - i0) / 60));
  for (let i = i0; i < s.v.length; i += step) pts.push(s.v[i]);
  pts.push(s.v[s.v.length - 1]);
  const mn = Math.min(...pts), mx = Math.max(...pts), W = 96, H = 28;
  const line = pts.map((p, i) => (i ? "L" : "M") + (i / (pts.length - 1) * W).toFixed(1) + " " + (H - 2 - (p - mn) / (mx - mn || 1) * (H - 4)).toFixed(1)).join("");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${line}" fill="none" stroke="${(e.r1 ?? 0) >= 0 ? "var(--up)" : "var(--down)"}" stroke-width="1.4" vector-effect="non-scaling-stroke"/></svg>`;
}

function render() {
  const active = ALL.filter(s => s.value);
  ALL.forEach(s => s.classList.toggle("on", !!s.value));
  $("clear").hidden = !active.length;
  $("fbtn").querySelector(".dot")?.remove();
  if (active.length) $("fbtn").insertAdjacentHTML("beforeend", '<span class="dot"></span>');

  const sort = $("sort").value;
  const res = ETFS.filter(matches).sort((a, b) =>
    sort === "ter" ? a.ter - b.ter :
    sort === "r1" ? (b.r1 ?? -9) - (a.r1 ?? -9) :

function niceTicks(mn, mx, count) {
  const raw = (mx - mn || 1) / count, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
  const out = []; for (let v = Math.ceil(mn / step) * step; v <= mx + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}

function drawChart() {
  const e = cur, s = e.s, box = $("chart"); if (!box) return;
  const from = PERIODS.find(p => p[0] === curPeriod)[1]();
  const i0 = from === 0 ? 0 : idxFrom(s, from), n = s.v.length;
  const step = Math.max(1, Math.floor((n - i0) / 420));
  const T = [], V = [];
  for (let i = i0; i < n; i += step) { T.push(s.t[i]); V.push(s.v[i]); }
  if (T[T.length - 1] !== s.t[n - 1]) { T.push(s.t[n - 1]); V.push(s.v[n - 1]); }

  const W = box.clientWidth, H = box.clientHeight, pl = 0, pr = 48, pt = 8, pb = 24;
  const mn0 = Math.min(...V), mx0 = Math.max(...V), pad = (mx0 - mn0) * 0.08 || mx0 * 0.02;
  const ticks = niceTicks(mn0 - pad, mx0 + pad, 3);
  const lo = Math.min(ticks[0], mn0 - pad), hi = Math.max(ticks[ticks.length - 1], mx0 + pad);
  const X = t => pl + (t - T[0]) / (T[T.length - 1] - T[0]) * (W - pl - pr);
  const Y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  const col = V[V.length - 1] >= V[0] ? "var(--up)" : "var(--down)";
  const line = T.map((t, i) => (i ? "L" : "M") + X(t).toFixed(1) + " " + Y(V[i]).toFixed(1)).join("");
  const dec = hi < 10 ? 2 : hi < 100 ? 1 : 0;
  const spanDays = (T[T.length - 1] - T[0]) / DAY;
  const xo = spanDays > 900 ? { year: "numeric" } : spanDays > 80 ? { month: "short" } : { day: "numeric", month: "short" };
  const nx = W < 420 ? 3 : 4, xt = [];
  for (let k = 0; k < nx; k++) xt.push(T[0] + (T[T.length - 1] - T[0]) * (k + 0.5) / nx);

  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="NAV ${esc(e.ticker)} ${curPeriod}">
    <defs><linearGradient id="gf" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".12"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    ${ticks.filter(v => v >= lo && v <= hi).map(v => `<line class="gl" x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${W}" y="${Y(v) + 4}" text-anchor="end">${fmt(v, dec)}</text>`).join("")}
    ${xt.map(t => `<text class="ax" x="${X(t)}" y="${H - 4}" text-anchor="middle">${dateTxt(t, xo)}</text>`).join("")}
    <path d="${line}L${X(T[T.length - 1])} ${H - pb}L${X(T[0])} ${H - pb}Z" fill="url(#gf)"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round"/>
    <g id="hv" visibility="hidden"><line id="hl" y1="${pt}" y2="${H - pb}" stroke="var(--soft)" stroke-width="1" stroke-dasharray="2 3"/><circle id="hc" r="4" fill="${col}" stroke="var(--bg)" stroke-width="2"/></g>
    <rect x="${pl}" y="0" width="${W - pl - pr}" height="${H}" fill="transparent" id="hit"/>
  </svg><div class="tip" id="tip" hidden></div>`;

  const hit = box.querySelector("#hit"), g = box.querySelector("#hv"), tip = box.querySelector("#tip"), hl = box.querySelector("#hl"), hc = box.querySelector("#hc");
  const move = ev => {
    const x = ev.clientX - box.getBoundingClientRect().left;
    const tt = T[0] + (x - pl) / (W - pl - pr) * (T[T.length - 1] - T[0]);
    let j = 0, best = Infinity; for (let k = 0; k < T.length; k++) { const d = Math.abs(T[k] - tt); if (d < best) { best = d; j = k; } }
    const cx = X(T[j]), cy = Y(V[j]);
    g.setAttribute("visibility", "visible");
    hl.setAttribute("x1", cx); hl.setAttribute("x2", cx); hc.setAttribute("cx", cx); hc.setAttribute("cy", cy);
    tip.hidden = false;
    tip.innerHTML = `<b>${fmt(V[j])}</b>${dateTxt(T[j])}`;
    const tw = tip.offsetWidth; tip.style.left = Math.min(Math.max(cx, tw / 2), W - tw / 2) + "px";
    tip.style.top = (cy > 56 ? cy - 46 : cy + 12) + "px";
  };
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", () => { g.setAttribute("visibility", "hidden"); tip.hidden = true; });

  const lr = []; for (let i = Math.max(i0, 1); i < n; i++) lr.push(Math.log(s.v[i] / s.v[i - 1]));
  const mean = lr.reduce((a, b) => a + b, 0) / lr.length;
  const vol = Math.sqrt(lr.reduce((a, b) => a + (b - mean) ** 2, 0) / (lr.length - 1)) * Math.sqrt(252);
  let peak = s.v[i0], mdd = 0; for (let i = i0; i < n; i++) { peak = Math.max(peak, s.v[i]); mdd = Math.min(mdd, s.v[i] / peak - 1); }
  const r = s.v[n - 1] / s.v[i0] - 1;
  $("pstats").innerHTML = [
    ["Rendimento", `<span class="${cls(r)}">${pct(r)}</span>`],
    ["Volatilità", fmt(vol * 100) + "%"],
    ["Max drawdown", pct(mdd)],
    ["Min – Max", `${fmt(Math.min(...V))} – ${fmt(Math.max(...V))}`],
  ].map(([k, v]) => `<div><span class="k">${k}</span><span class="n">${v}</span></div>`).join("");
}

// Valida un portafoglio importato: restituisce { pf, err }.
function cleanPf(p) {
  const err = [];
  if (!p || typeof p !== "object") return { err: ["portafoglio non valido"] };
  const name = String(p.name || "").trim() || "Senza nome";
  const id = String(p.id || "").trim() || name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "pf-" + Date.now();
  const lots = [];
  (Array.isArray(p.lots) ? p.lots : []).forEach((l, i) => {
    const n = i + 1, isin = String((l && l.isin) || "").trim().toUpperCase(), qty = +(l && l.qty), price = +(l && l.price);
    if (!byIsin(isin)) return err.push(`acquisto ${n}: ISIN ${isin || "mancante"} non disponibile`);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(l.date || "") || isNaN(dateMs(l.date))) return err.push(`acquisto ${n}: data non valida (AAAA-MM-GG)`);
    if (dateMs(l.date) > Date.now() + DAY) return err.push(`acquisto ${n}: data nel futuro`);
    if (!(qty > 0) || !(price > 0)) return err.push(`acquisto ${n}: quantità o prezzo non validi`);
    lots.push({ isin, date: l.date, qty, price });
  });
  if (!lots.length && !err.length) err.push("nessun acquisto");
  lots.sort((a, b) => a.date.localeCompare(b.date));
  return { pf: { id, name, currency: String(p.currency || "EUR"), lots }, err };
}

// Frontiera efficiente long-only da portafogli casuali, rendimenti e covarianze storici (rf = 0).
function frontier(P) {

  const mu = R.map(r => r.reduce((a, b) => a + b, 0) / nn);
  const C = R.map((a, i) => R.map((b, j) => { let s = 0; for (let m = 0; m < nn; m++) s += (a[m] - mu[i]) * (b[m] - mu[j]); return s / (nn - 1) * 252; }));
  const M = mu.map(x => x * 252);
  const ev = w => { let r = 0, v = 0; for (let i = 0; i < k; i++) { r += w[i] * M[i]; for (let j = 0; j < k; j++) v += w[i] * w[j] * C[i][j]; } return { r, v: Math.sqrt(Math.max(v, 0)), w }; };

    const s = w.reduce((a, b) => a + b, 0); pts.push(ev(w.map(x => x / s)));

    let b = best, sb = score(b); const rr = rng(99);

  const maxS = refine(pts.reduce((a, p) => (p.r / p.v > a.r / a.v ? p : a)), p => p.r / p.v);

  for (const p of srt) if (p.v > minV.v && p.r > best) { best = p.r; line.push(p); }
  const cur = ev(P.cw);
  return { pts, bg: pts.filter((_, i) => i % 60 === 0), line, minV, maxS, cur, yrs: (t[t.length - 1] - t[0]) / (365.25 * DAY) };
}

$("clear").addEventListener("click", () => { ALL.forEach(s => (s.value = "")); render(); });
$("fbtn").addEventListener("click", ev => {
  const b = ev.currentTarget, open = b.getAttribute("aria-expanded") !== "true";
  b.setAttribute("aria-expanded", open); $("filters").hidden = !open;
});
document.addEventListener("keydown", ev => { if (ev.key === "/" && !/INPUT|SELECT/.test(document.activeElement.tagName)) { ev.preventDefault(); $("q").focus(); } });

/* ---------- Avvio ---------- */
applyPrices(); loadUser(); allPf(); pfCur = PFLIST[0]; fillSel();
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => showView(b.dataset.v)));
$("pf-sel").addEventListener("change", ev => { pfCur = PFLIST.find(p => p.id === ev.target.value); ioMsg(""); renderPf(); });
$("pf-periods").addEventListener("click", ev => { const b = ev.target.closest("button"); if (!b) return; pfPeriod = b.dataset.p; document.querySelectorAll("#pf-periods button").forEach(x => x.setAttribute("aria-pressed", x === b)); drawPfNav(); });
$("pf-comp").addEventListener("click", ev => { const b = ev.target.closest(".nm-btn"); if (b) openDetail(b.dataset.isin); });
$("io-exp").addEventListener("click", exportJson);
$("io-copy").addEventListener("click", async () => { try { if (!$("json-box").value) $("json-box").value = pfJson(); await navigator.clipboard.writeText($("json-box").value); ioMsg("Copiato"); } catch { $("json-box").select(); ioMsg("Selezionato: copia con Ctrl+C"); } });
$("io-imp").addEventListener("click", () => importJson($("json-box").value));
$("io-file").addEventListener("change", ev => { const f = ev.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $("json-box").value = r.result; importJson(r.result); }; r.readAsText(f); ev.target.value = ""; });
$("io-del").addEventListener("click", ev => {
  const b = ev.currentTarget;
  if (b.dataset.arm !== "1") { b.dataset.arm = "1"; b.textContent = "Conferma"; setTimeout(() => { b.dataset.arm = ""; b.textContent = "Elimina"; }, 3000); return; }
  b.dataset.arm = ""; b.textContent = "Elimina";
  USER = USER.filter(u => u.id !== pfCur.id); saveUser(); allPf(); pfCur = PFLIST[0]; fillSel(); renderPf(); ioMsg("Portafoglio eliminato");
});
let rt2; window.addEventListener("resize", () => { clearTimeout(rt2); rt2 = setTimeout(() => { if (!$("v-port").hidden) { drawPfNav(); drawEF(); } }, 120); });

render(); renderPf();
showView(location.hash === "#cerca" ? "search" : "port");
</script>
