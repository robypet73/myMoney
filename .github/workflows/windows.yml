name: App Windows

# Costruisce myMoney.exe (il server locale con Python incluso, apre da solo il browser) e lo pubblica nella release «windows-latest».
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, native.js, sw.js, manifest.webmanifest, scripts/**, .github/workflows/windows.yml]

permissions:
  contents: write

concurrency:
  group: windows
  cancel-in-progress: true

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa gli strumenti
        run: pip install pyinstaller pillow
      - name: Icona
        run: python -c "from PIL import Image; Image.open('icons/icon-512.png').convert('RGBA').save('icon.ico', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"
      - name: Costruisci myMoney.exe
        run: |
          pyinstaller --onefile --name myMoney --icon icon.ico --paths scripts \
            --hidden-import fetch_prices --hidden-import fetch_quotes --hidden-import fetch_series --hidden-import fetch_etf_data --hidden-import fetch_catalog \
            scripts/serve.py
      - name: Aggiorna myMoney.exe nella root del repo
        # L'exe contiene solo il server e gli script (non l'app): cambia solo se cambiano gli script. PyInstaller non è riproducibile,
        # quindi lo si committa solo in quel caso, per non gonfiare il repo (circa 9 MB a ogni commit).
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          n=1
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            n=$(git diff --name-only "$BEFORE" HEAD -- scripts .github/workflows/windows.yml | wc -l)
          fi
          if [ "$n" -gt 0 ]; then
            cp dist/myMoney.exe myMoney.exe
            git config user.name "myMoney exe"
            git config user.email "actions@users.noreply.github.com"
            git add myMoney.exe
            git commit -m "myMoney.exe ricostruito (script cambiati)" || true
            git pull --rebase origin main
            git push origin main
          else
            echo "Script invariati: myMoney.exe nella root resta quello di prima"
          fi
      - name: Prepara la cartella
        run: |
          mkdir -p pkg/myMoney
          cp dist/myMoney.exe pkg/myMoney/myMoney.exe
          cp -r index.html sw.js native.js manifest.webmanifest prices.js etfdata.js catalog.js quotes.js watchlist.txt icons data pkg/myMoney/
          cp scripts/LEGGIMI-Windows.txt pkg/myMoney/
          v=$(grep -o 'id="ver">v[0-9][0-9]\.[0-9][0-9]\.[0-9][0-9][0-9]' index.html | head -1 | sed 's/.*>v//')
          echo "VER=$v" >> "$GITHUB_ENV"
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path pkg/myMoney -DestinationPath myMoney-windows.zip
      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create windows-latest myMoney-windows.zip --target main --title "App Windows v${VER}" --notes "Cartella zip con myMoney.exe: estrai, doppio clic, si apre il browser. Versione ${VER}. L'eseguibile non è firmato: SmartScreen chiede «Maggiori informazioni → Esegui comunque»."
