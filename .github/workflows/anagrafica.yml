name: Aggiorna anagrafica quotazioni

# Elenca da Yahoo Finance tutti gli ETF/ETC/ETN delle borse principali (Milano, Xetra, Parigi, Amsterdam, Londra, Svizzera), li abbina agli ISIN del catalogo
# e scrive anagrafica.js (borse, valute di negoziazione, volume medio, spread, simbolo preferito): la pagina lo legge all'avvio per i criteri di ricerca.
on:
  schedule:
    - cron: "17 3 * * 0"   # ogni domenica alle 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anagrafica
  cancel-in-progress: false

jobs:
  anagrafica:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Scarica l'anagrafica
        run: python3 scripts/fetch_anagrafica.py --max-search 4000
      - name: Salva su main
        run: |
          if git diff --quiet -- anagrafica.js data/anag-miss.json && [ -z "$(git ls-files --others --exclude-standard anagrafica.js data/anag-miss.json)" ]; then echo "Nessuna novità"; exit 0; fi
          git config user.name "myMoney anagrafica"
          git config user.email "actions@users.noreply.github.com"
          git add anagrafica.js data/anag-miss.json
          git commit -m "Anagrafica quotazioni aggiornata"
          git pull --rebase origin main
          git push origin HEAD:main
