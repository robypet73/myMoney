name: Aggiorna dati ETF

# Scarica anagrafica e composizione degli ETF da justETF e aggiorna etfdata.js su main (la pagina su GitHub Pages lo legge).
on:
  schedule:
    - cron: "17 5 * * 1"   # ogni lunedì alle 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dati-etf
  cancel-in-progress: false

jobs:
  dati:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Scarica i dati
        run: python3 scripts/fetch_etf_data.py
      - name: Salva su main
        run: |
          if git diff --quiet -- etfdata.js; then echo "Nessuna novità"; exit 0; fi
          git config user.name "myMoney dati"
          git config user.email "actions@users.noreply.github.com"
          git add etfdata.js
          git commit -m "Dati ETF aggiornati"
          git pull --rebase origin main
          git push origin HEAD:main
