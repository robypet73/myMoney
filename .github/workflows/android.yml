name: Android APK

# Costruisce l'app Android di portafoglio.html (involucro Capacitor + motore JavaScript al posto del programma Python)
# e la pubblica nella release «android-latest». Non tocca il programma per PC.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [portafoglio.html, portafogli/**, fonti.py, fineco_gratis.json, icons/**, app-android/**, .github/workflows/android.yml]

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepara la pagina dell'app
        run: python3 app-android/prepara.py
      - name: Progetto Capacitor
        working-directory: app-android
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
      - name: Cartella (telefono o Google Drive) e widget della schermata Home
        working-directory: app-android
        run: |
          set -e
          main=android/app/src/main
          pk=$(grep -o '"appId": *"[^"]*"' capacitor.config.json | sed 's/.*"\([^"]*\)"$/\1/' | tr . /)
          cp overlay/java/*.java $main/java/$pk/
          cp -r overlay/res/. $main/res/
          python3 overlay/patch_manifest.py $main/AndroidManifest.xml overlay/receiver.xml overlay/permissions.xml
          sed -i '0,/^dependencies {/s//dependencies {\n    implementation "androidx.documentfile:documentfile:1.0.1"/' android/app/build.gradle
          sed -i '0,/^dependencies {/s//dependencies {\n    implementation "androidx.work:work-runtime:2.9.1"/' android/app/build.gradle
          grep -n "documentfile\|work-runtime" android/app/build.gradle
      - name: Icona e versione
        working-directory: app-android/android/app/src/main
        run: |
          set -e
          sudo apt-get install -y --no-install-recommends imagemagick >/dev/null
          conv() { command -v convert >/dev/null && convert "$@" || magick "$@"; }
          # il disegno si riduce al 72% al centro, così la maschera adattiva di Android non taglia l'icona
          conv ../../../../../icons/icon-maskable-512.png \( ../../../../../icons/icon-maskable-512.png -resize 72% \) -gravity center -composite /tmp/icon-fg.png
          for s in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read d l f <<< "$s"
            conv /tmp/icon-fg.png -resize ${l}x${l} res/mipmap-$d/ic_launcher.png
            conv /tmp/icon-fg.png -resize ${l}x${l} res/mipmap-$d/ic_launcher_round.png
            conv /tmp/icon-fg.png -resize ${f}x${f} res/mipmap-$d/ic_launcher_foreground.png
          done
          sed -i 's/#FFFFFF/#0B1F1A/I' res/values/ic_launcher_background.xml
          v=$(date +%y.%m.%d)
          echo "VER=$v" >> "$GITHUB_ENV"
          cd ../..
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"1.0\"/versionName \"$v\"/" build.gradle
      - name: Chiave di firma fissa (facoltativa)
        # Android aggiorna un'app solo se la firma è la stessa: con la chiave di debug casuale di ogni esecuzione l'aggiornamento
        # sopra l'app già installata viene rifiutato. La chiave fissa sta nel segreto MYMONEY_KEYSTORE_B64 (base64 del keystore).
        env:
          KS: ${{ secrets.MYMONEY_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::warning::Segreto MYMONEY_KEYSTORE_B64 non impostato: firma casuale, per aggiornare disinstalla prima la versione precedente"
            exit 0
          fi
          printf '%s' "$KS" | tr -d ' \n\r\t' | base64 -d > "$RUNNER_TEMP/mymoney.keystore"
          keytool -list -v -keystore "$RUNNER_TEMP/mymoney.keystore" -storepass android | grep -E "Alias name|Owner|SHA256" || { echo "::error::Il segreto MYMONEY_KEYSTORE_B64 non è un keystore valido"; exit 1; }
          echo "KEYSTORE=$RUNNER_TEMP/mymoney.keystore" >> "$GITHUB_ENV"
      - name: Costruisci l'APK
        working-directory: app-android/android
        run: |
          if [ -n "$KEYSTORE" ]; then
            ./gradlew assembleDebug --no-daemon -Pandroid.injected.signing.store.file="$KEYSTORE" -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android
          else
            ./gradlew assembleDebug --no-daemon
          fi
      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app-android/android/app/build/outputs/apk/debug/app-debug.apk myMoney-Portafogli.apk
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest myMoney-Portafogli.apk --target main --title "App Android ${VER}" --notes "APK di myMoney Portafogli (portafoglio.html con motore JavaScript). Versione ${VER}. Se Android rifiuta l'aggiornamento, disinstalla la versione precedente."
      - uses: actions/upload-artifact@v4
        with:
          name: myMoney-Portafogli-apk
          path: myMoney-Portafogli.apk
